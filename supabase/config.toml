# As duas functions são chamadas pelo pg_net (trigger e cron), não por um
# usuário logado — não existe um JWT de sessão Supabase pra mandar. A
# autenticação é o header x-webhook-secret conferido dentro do código de cada
# function, por isso o verify_jwt do gateway precisa ficar desligado aqui.
[functions.notify-agendamento]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

# O app Calendário do iPhone busca o feed .ics sozinho e não manda header
# customizado nenhum — a autenticação é o ?token= conferido dentro do código
# (agenda-ics/index.ts), por isso o verify_jwt do gateway fica desligado aqui.
[functions.agenda-ics]
verify_jwt = false
